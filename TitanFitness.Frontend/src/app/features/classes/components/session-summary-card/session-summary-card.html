<div class="border-bottom pb-3">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
    <h4 class="fw-bold text-primary-emphasis mb-0">{{ session().className }}</h4>
    <span class="badge text-bg-light border">
      <fa-icon [icon]="capacityGlyph" class="me-1"></fa-icon>
      {{ session().remainingPlaces }} / {{ session().capacityLimit }} spots remaining
    </span>
  </div>
  <div class="d-flex flex-wrap gap-3 mt-2 small text-secondary">
    <app-icon-label [icon]="clockGlyph">{{ dayCaption() }}, {{ beginTime() }} - {{ finishTime() }}</app-icon-label>
    <app-icon-label [icon]="coachGlyph">Trainer: {{ session().trainerName }}</app-icon-label>
    <app-icon-label [icon]="roomGlyph">{{ session().studioName }}</app-icon-label>
  </div>
</div>
