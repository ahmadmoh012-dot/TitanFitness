<div class="d-flex flex-column flex-md-row gap-3">
  <div>
    <app-branch-filter [branches]="branches()" [selectedBranchId]="branchId()" (branchChanged)="branchChanged.emit($event)"></app-branch-filter>
  </div>
  <div>
    <input type="date" class="form-control" [value]="date()" (change)="handleDateChange($event)">
  </div>
  <app-button variant="primary" (clicked)="addClass.emit()">+ Add Class</app-button>
</div>
