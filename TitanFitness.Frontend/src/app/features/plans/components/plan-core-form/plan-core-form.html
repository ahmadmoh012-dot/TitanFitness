<div class="card">
  <div class="card-header bg-white py-3">
    <h5 class="fw-bold mb-0">Plan Details</h5>
  </div>
  <div class="card-body">
    <div class="row g-4">
      @for (field of fields;track field.control) {
      <div class="col-12 col-md-6">
        <app-text-field [label]="field.label" [type]="field.type" [control]="ctrl(field.control)" [placeholder]="field.placeholder" [requiredMark]="field.requiredMark" [errorMessage]="field.errorMessage" [min]="field.min" [step]="field.step"></app-text-field>
      </div>
      }
      <div class="col-12 col-md-6">
        <app-field-label>Status</app-field-label>
        <div class="form-check">
          <input id="planIsPublished" type="checkbox" class="form-check-input" [formControl]="publishedControl()">
          <label for="planIsPublished" class="form-check-label">IsPublished</label>
        </div>
        @if (!viewMode()) {
        <app-field-message type="helper">Ticked means true, unticked means false.</app-field-message>
        }
      </div>
    </div>
  </div>
</div>
