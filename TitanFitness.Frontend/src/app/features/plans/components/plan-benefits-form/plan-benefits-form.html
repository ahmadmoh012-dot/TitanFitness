<div class="card">
  <div class="card-header bg-white py-3">
    <h5 class="fw-bold mb-0">Terms Offered</h5>
  </div>
  <div class="card-body">
    <div class="row g-4">
      @for (field of fields;track field.control) {
      <div class="col-12 col-md-6">
        <app-text-field [label]="field.label" type="number" [control]="ctrl(field.control)" [placeholder]="field.placeholder" [errorMessage]="field.errorMessage" [min]="0" [step]="1"></app-text-field>
      </div>
      }
      <div class="col-12 col-md-6">
        <app-field-label [block]="true">Access scope</app-field-label>
        @if (viewMode()) {
        <input type="text" class="form-control" [value]="accessScopeCaption()" disabled>
        } @else {
        <div class="d-flex flex-column flex-sm-row gap-2">
          <div class="form-check border rounded px-3 py-2">
            <input id="homeBranchOnly" type="radio" class="form-check-input ms-0 me-2" [value]="AccessScope.HomeBranchOnly" [formControl]="accessScopeControl()">
            <label for="homeBranchOnly" class="form-check-label">Home branch only</label>
          </div>
          <div class="form-check border rounded px-3 py-2">
            <input id="allBranches" type="radio" class="form-check-input ms-0 me-2" [value]="AccessScope.AllBranches" [formControl]="accessScopeControl()">
            <label for="allBranches" class="form-check-label">All branches</label>
          </div>
        </div>
        @if (accessScopeControl().touched && accessScopeControl().invalid) {
        <app-field-message type="error">Access scope is required.</app-field-message>
        }
        }
      </div>
    </div>
  </div>
</div>
