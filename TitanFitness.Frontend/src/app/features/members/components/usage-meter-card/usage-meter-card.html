<div class="card h-100">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small fw-semibold text-secondary text-uppercase">{{ title() }}</span>
      <span class="fw-semibold">{{ used() }} / {{ allowed() }}</span>
    </div>
    <div class="progress mb-2">
      <div class="progress-bar" role="progressbar" [style.width.%]="progressPct()" [attr.aria-valuenow]="progressPct()" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <span class="small text-secondary">
      {{ left() }}
      {{ itemName() }}{{ left()===1 ? '' : 's' }}
      remaining
    </span>
  </div>
</div>
