<app-field-label [requiredMark]="true">Select new plan</app-field-label>

<select class="form-select" [value]="selectedPlanId()??''" (change)="propagateChange($event)">
  <option value="">Select a plan</option>
  @for (tier of plans();track tier.planId) {
  <option [value]="tier.planId">{{ tier.planName }} — {{ tier.price|number:'1.2-2' }} / {{ tier.durationInMonths }} months</option>
  }
</select>

<div class="form-text">Only published plans available to this member are listed.</div>
