<div class="card">
  <div class="card-body p-4">
    <div class="position-relative w-50 mx-auto mb-4">
      <div class="ratio ratio-1x1 rounded-3 overflow-hidden bg-secondary-subtle">
        <app-profile-photo [photo]="member().photo" [alt]="member().fullName"></app-profile-photo>
      </div>
      <div class="position-absolute top-0 end-0 m-2">
        <app-status-chip [status]="status()"></app-status-chip>
      </div>
    </div>
    <div class="text-center mb-4">
      <h5 class="fw-bold mb-1">{{ member().fullName }}</h5>
      <span class="text-primary small">ID: {{ member().membershipNumber }}</span>
    </div>
    <div class="d-grid gap-2 small">
      @if (member().email) {
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="emailGlyph" class="text-secondary"></fa-icon>
        <span>{{ member().email }}</span>
      </div>
      }
      @if (member().phone) {
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="phoneGlyph" class="text-secondary"></fa-icon>
        <span>{{ member().phone }}</span>
      </div>
      }
      @if (member().address) {
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="locationGlyph" class="text-secondary"></fa-icon>
        <span>{{ member().address }}</span>
      </div>
      }
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="dateGlyph" class="text-secondary"></fa-icon>
        <span>Joined: {{ member().joinedDate|date:'MMM d, y' }}</span>
      </div>
    </div>
  </div>
</div>
