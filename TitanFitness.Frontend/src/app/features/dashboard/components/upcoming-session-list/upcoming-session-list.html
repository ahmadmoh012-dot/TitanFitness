<div class="card h-100">
  <div class="card-header bg-white d-flex justify-content-between align-items-center py-2 px-3">
    <h5 class="mb-0">Upcoming Classes</h5>
    <button type="button" class="schedule-link-btn" (click)="viewSchedule.emit()">View Schedule</button>
  </div>
  <div class="card-body p-0">
    @if (classes().length === 0) {
      <app-empty-state title="No upcoming classes"></app-empty-state>
    } @else {
      @for (lesson of classes();track lesson.sessionId) {
        <app-upcoming-session-row [session]="lesson"></app-upcoming-session-row>
      }
    }
  </div>
</div>
